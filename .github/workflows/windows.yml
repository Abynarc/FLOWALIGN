name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch JUCE
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/juce-framework/JUCE.git ../JUCE
          if ($LASTEXITCODE) { throw 'JUCE clone failed' }
          git -C ../JUCE checkout 454fe891acc8204f99f4ef1e3a28c84b1a4da145
          if ($LASTEXITCODE) { throw 'JUCE checkout failed' }
      - name: Build VST3 and EXE
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FLOWALIGN-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-Windows-Install-*.txt
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
