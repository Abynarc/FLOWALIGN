name: macOS installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch JUCE
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/juce-framework/JUCE.git ../JUCE
          git -C ../JUCE checkout 454fe891acc8204f99f4ef1e3a28c84b1a4da145
      - name: Build Universal AU and PKG
        run: python3 packaging/build_distribution.py --no-dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FLOWALIGN-macOS-Universal
          path: |
            dist/*.pkg
            dist/*-Install-EN.txt
            dist/*-Установка.txt
            dist/*-sha256.json
          if-no-files-found: error
