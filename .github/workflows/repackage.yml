name: Repackage verified Windows build
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Successful Windows run to reuse (no compiled-source changes)'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  repackage:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reuse identical verified plug-in payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid source run' }
          $run = gh run view $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --json conclusion,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.conclusion -ne 'success' -or $run.headSha -notmatch '^[a-f0-9]{40}$') { throw 'A successful source run is required' }
          git fetch origin $run.headSha --depth=1
          if ($LASTEXITCODE) { throw 'Cannot fetch verified source' }
          git diff --quiet $run.headSha HEAD -- Source CMakeLists.txt third_party LICENSE THIRD_PARTY.md packaging/build_windows.ps1 packaging/windows .github/checks
          if ($LASTEXITCODE) { throw 'Compiled sources or installer logic changed; use a fresh build' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name FLOWALIGN-Windows-x64 --dir verified
          if ($LASTEXITCODE) { throw 'Cannot download verified installer' }
          Get-Content verified/SHA256SUMS-Windows.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            if ($parts.Count -ne 2 -or (Split-Path $parts[1] -Leaf) -ne $parts[1] -or (Get-FileHash (Join-Path verified $parts[1])).Hash.ToLowerInvariant() -ne $parts[0]) { throw 'Verified artifact hash mismatch' }
          }
          $oldSetup = (Get-ChildItem verified/*-Setup.exe).FullName
          $install = Start-Process $oldSetup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw 'Cannot install verified payload' }
          $bundle = 'C:\Program Files\Common Files\VST3\FLOWALIGN.vst3'
          $destination = 'build-repackage/FLOWALIGN_artefacts/Release/VST3'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item $bundle $destination -Recurse -Force
          $binary = Join-Path $bundle 'Contents/x86_64-win/FLOWALIGN.vst3'
          @{ sourceRun = $env:SOURCE_RUN; compiledCommit = $run.headSha; binarySHA256 = (Get-FileHash $binary).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/repackage-evidence.json"
      - name: Build installer with current instructions
        shell: pwsh
        run: ./packaging/build_windows.ps1 -BuildDir build-repackage -SkipBuild
      - name: Verify install, upgrade, VST3 and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/*-Setup.exe).FullName
          $bundle = 'C:\Program Files\Common Files\VST3\FLOWALIGN.vst3'
          $source = (Resolve-Path 'build-repackage/FLOWALIGN_artefacts/Release/VST3/FLOWALIGN.vst3').Path
          foreach ($pass in @('install', 'upgrade')) {
            $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP/$pass.log" -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "$pass failed" }
            Get-ChildItem $source -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring($source.Length + 1)
              if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash (Join-Path $bundle $relative)).Hash) { throw "Installed payload mismatch: $relative" }
            }
          }
          $evidence = Get-Content "$env:RUNNER_TEMP/repackage-evidence.json" -Raw | ConvertFrom-Json
          if ((Get-FileHash (Join-Path $bundle 'Contents/x86_64-win/FLOWALIGN.vst3')).Hash.ToLowerInvariant() -ne $evidence.binarySHA256) { throw 'Repackaging changed the verified binary' }
          $backup = Get-ChildItem 'C:\ProgramData\FLOWMINNERS\FLOWALIGN\Backups' -Recurse -Directory -Filter FLOWALIGN.vst3 | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$backup) { throw 'Upgrade backup missing' }
          Get-ChildItem $source -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($source.Length + 1)
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash (Join-Path $backup.FullName $relative)).Hash) { throw "Backup mismatch: $relative" }
          }
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile "$env:RUNNER_TEMP/pluginval.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/pluginval.zip").Hash.ToLowerInvariant() -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') { throw 'Validator checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/pluginval.zip" "$env:RUNNER_TEMP/pluginval"
          $validator = (Get-ChildItem "$env:RUNNER_TEMP/pluginval" -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          $validation = Start-Process $validator -ArgumentList '--validate-in-process','--strictness-level','5','--output-dir',"$env:RUNNER_TEMP/validation",'--validate',"`"$bundle`"" -PassThru -Wait
          if ($validation.ExitCode -ne 0) { throw 'VST3 validation failed' }
          $uninstall = Start-Process 'C:\Program Files\FLOWMINNERS\FLOWALIGN\unins000.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$bundle/Contents/x86_64-win/FLOWALIGN.vst3")) { throw 'Uninstall failed' }
          if (!(Test-Path 'C:\ProgramData\FLOWMINNERS\FLOWALIGN\Backups')) { throw 'Backups removed by uninstall' }
      - name: Installer for distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FLOWALIGN-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-Windows-x64-VST3.zip
            dist/*-Windows-Install-*.txt
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
      - name: Repackaging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-diagnostics
          path: |
            ${{ runner.temp }}/repackage-evidence.json
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/upgrade.log
            ${{ runner.temp }}/validation
          if-no-files-found: ignore
          retention-days: 7
